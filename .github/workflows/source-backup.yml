name: Source backup artifact
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload full repository source
        uses: actions/upload-artifact@v4
        with:
          name: supporto-3-0-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 7
