<script>
(()=>{
const D=window.SUPPORTO_DATA,S={journey:"Percorso completo",filter:"Tutti",q:""},app=document.getElementById("app"),drawer=document.getElementById("drawer"),$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const go=id=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"}); const ext=u=>u&&window.open(u,"_blank","noopener");
function render(){const library=D.resources.filter(r=>r.library!==false),available=library.filter(r=>r.status==="disponibile").length,areas=["Tutti",...new Set(library.map(r=>r.area))];
app.innerHTML=`
<section class="hero" id="home"><div class="eyebrow">BE ONE TEAM · SUPPORTO 3.0</div><h1>${esc(D.meta.subtitle)}</h1><p>Un unico punto per trovare formazione, strumenti e prossimi passi. Segui il percorso oppure cerca direttamente ciò che ti serve.</p><p style="margin-top:14px;font-weight:800;letter-spacing:.04em;">VIETATO CONDIVIDERE FUORI LINEA · TAB SILVIA MARCHESI - DIEGOS BOTTI - SIMONA FORMICA</p><div class="actions"><button class="btn primary" id="start">Inizia il percorso</button><button class="btn secondary" id="library">Vai ai materiali</button></div><div class="stats"><span class="stat"><b>${available}</b> materiali disponibili</span><span class="stat"><b>11 step</b> percorso guidato</span><span class="stat">Aggiornato ${esc(D.meta.updated)}</span></div></section>
<section class="section" id="percorso"><div class="head"><div><div class="eyebrow">Percorso guidato</div><h2>Cosa fare adesso</h2></div><small>segui l'ordine</small></div><div class="steps" id="steps"></div></section>
<section class="section" id="materiali"><div class="head"><div><div class="eyebrow">Libreria</div><h2>Materiali del team</h2></div><small>disponibili + in preparazione</small></div><input id="search" class="search" placeholder="Cerca un materiale…"><div class="chips">${areas.map(a=>`<button class="chip ${S.filter===a?"on":""}" data-a="${esc(a)}">${esc(a)}</button>`).join("")}</div><div class="grid" id="grid"></div></section>
<section class="section" id="team"><div class="head"><div><div class="eyebrow">Community</div><h2>Resta collegato al team</h2></div></div><div class="community"><div class="plane">✈</div><div><b>Telegram Team</b><p>Avvisi, aggiornamenti e collegamenti rapidi ai materiali.</p></div><button id="tgGo">Apri Telegram</button></div></section>
<div class="footer">BE ONE TEAM · SUPPORTO 3.0</div>`;
$("start").onclick=()=>go("percorso");$("library").onclick=()=>go("materiali");$("tgGo").onclick=()=>ext(D.telegram);$("search").oninput=e=>{S.q=e.target.value;cards()};

document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.a;document.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x.dataset.a===S.filter));cards()});steps();cards()}
function steps(){const rows=D.paths[S.journey]||[];$("steps").innerHTML=rows.map(r=>`<div class="step" data-resource="${esc(r.resource||"")}"><div class="num">${r.n}</div><div><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div><span class="badge ${r.status==="disponibile"?"ready":""}">${r.status==="disponibile"?"DISPONIBILE":"IN PREPARAZIONE"}</span></div>`).join("");document.querySelectorAll(".step[data-resource]").forEach(e=>{if(!e.dataset.resource)return;e.onclick=()=>{const row=rows.find(x=>x.resource===e.dataset.resource);const material=D.resources.find(x=>x.id===e.dataset.resource);if(material){detail(material);return}if(row)detail({id:row.resource,title:row.title,type:"Percorso",area:"Percorso guidato",description:row.text,learn:row.text,action:"Segui questo punto del percorso.",next:"Continua con il punto successivo.",shareSection:true})}})}
function cards(){const q=S.q.trim().toLowerCase(),rows=D.resources.filter(r=>r.library!==false&&(S.filter==="Tutti"||r.area===S.filter)&&(!q||[r.title,r.area,r.type,r.description,r.learn].join(" ").toLowerCase().includes(q))).sort((a,b)=>a.order-b.order);$("grid").innerHTML=rows.length?rows.map(r=>`<article class="card ${r.status!=="disponibile"?"muted":""}" data-id="${esc(r.id)}"><div class="topline"><span class="type">${esc(r.type)}</span><span class="area">${esc(r.area)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p>${r.status==="disponibile"?`<div class="open">${esc(r.cta||"Apri materiale")} →</div>`:'<div class="prep">In preparazione</div>'}</article>`).join(""):'<div class="empty">Nessun materiale trovato.</div>';document.querySelectorAll(".card:not(.muted)").forEach(e=>e.onclick=()=>detail(D.resources.find(r=>r.id===e.dataset.id)))}
function detail(r){if(!r)return;$("dType").textContent=[r.type,r.area].filter(Boolean).join(" · ");$("dTitle").textContent=r.title;$("dLearn").textContent=r.learn||r.description;$("dAction").textContent=r.action||"Apri il materiale e applica il contenuto.";$("dNext").textContent=r.next||"Continua con il modulo successivo.";const a=$("dActions");a.querySelectorAll("a.extra").forEach(x=>x.remove());const o=$("dOpen");if(Array.isArray(r.links)&&r.links.length){o.style.display="none";r.links.forEach((x,i)=>{const el=document.createElement("a");el.className="btn "+(i===0?"primary":"secondary")+" extra";el.target="_blank";el.rel="noopener";el.href=x.url;el.textContent=x.label;a.insertBefore(el,$("dShare"))})}else{o.textContent=r.cta||"Apri materiale";o.href=r.link||"#";o.style.display=r.link?"block":"none"}const share=$("dShare");share.style.display=r.shareSection?"block":"none";share.onclick=async()=>{if(!r.shareSection)return;const url=location.origin+location.pathname+"?sezione="+encodeURIComponent(r.id);try{if(navigator.share){await navigator.share({title:r.title,text:r.shareText||("Guarda "+r.title),url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);const t=share.textContent;share.textContent="Link copiato";setTimeout(()=>share.textContent=t,1600)}else{window.prompt("Copia questo link",url)}}catch(e){if(e&&e.name!=="AbortError"){window.prompt("Copia questo link",url)}}};drawer.classList.add("on")}
function close(){drawer.classList.remove("on")}document.getElementById("tgTop").onclick=()=>ext(D.telegram);$("close").onclick=close;$("close2").onclick=close;drawer.onclick=e=>{if(e.target===drawer)close()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");go(b.dataset.go)});render();const openShared=()=>{const q=new URLSearchParams(location.search).get("sezione");const m=location.hash.match(/^#materiale=(.+)$/);const id=q||(m?decodeURIComponent(m[1]):null);if(!id)return;const card=[...document.querySelectorAll(".card[data-id]")].find(x=>x.dataset.id===id);if(card){card.scrollIntoView({block:"center"});card.click();return}const step=[...document.querySelectorAll(".step[data-resource]")].find(x=>x.dataset.resource===id);if(step){step.scrollIntoView({block:"center"});step.click();return}const r=D.resources.find(x=>x.id===id);if(r)detail(r)};setTimeout(openShared,250);window.addEventListener("hashchange",()=>setTimeout(openShared,50));
})();
</script>
