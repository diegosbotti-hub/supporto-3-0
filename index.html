<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Supporto 3.0 — BE ONE TEAM</title>

<style>
:root{--g:#16884a;--g2:#eaf7ef;--dark:#14221a;--ink:#172019;--mut:#68726b;--line:#e1e8e3;--bg:#f5f8f5;--gold:#c8a85d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(245,248,245,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:960px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 5px 16px rgba(20,34,26,.10)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1}.brand b{display:block;font-size:17px;letter-spacing:-.01em}.brand span{font-size:11px;color:var(--mut)}.telegram{border:0;border-radius:12px;background:var(--dark);color:#fff;padding:10px 13px;font-weight:850;cursor:pointer}
.wrap{max-width:960px;margin:auto;padding:0 16px 28px}.hero{margin:18px 0 0;padding:26px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at 90% 0,#f1e7c8 0,transparent 31%),linear-gradient(135deg,#fff,#edf8f1 70%);box-shadow:0 15px 38px rgba(20,34,26,.07);overflow:hidden}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--g);font-weight:950}.hero h1{font-size:clamp(32px,8vw,54px);line-height:.98;letter-spacing:-.045em;margin:9px 0 12px}.hero p{max-width:650px;margin:0 0 19px;color:var(--mut);font-size:15px;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:9px}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.stats{margin-top:17px;display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:11px;color:var(--mut);background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.stat b{color:var(--ink)}
.section{margin-top:30px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.head h2{margin:3px 0 0;font-size:23px;letter-spacing:-.025em}.head small{color:var(--mut)}
.tabs,.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.tab,.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:850;cursor:pointer}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}.chip.on{background:var(--g2);color:var(--g);border-color:#bfe2ca}
.steps{display:grid;gap:9px;margin-top:11px}.step{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center}.num{width:40px;height:40px;border-radius:13px;background:var(--g2);color:var(--g);display:grid;place-items:center;font-weight:950}.step b{font-size:14px}.step p{margin:4px 0 0;color:var(--mut);font-size:12px;line-height:1.4}.badge{font-size:9px;font-weight:950;border-radius:999px;padding:6px 8px;background:#eff2ef;color:#68736c}.badge.ready{background:var(--g2);color:var(--g)}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;font-size:16px;outline:none;margin-bottom:9px;box-shadow:0 5px 16px rgba(20,34,26,.03)}.search:focus{border-color:#9fceb0;box-shadow:0 0 0 3px rgba(22,136,74,.09)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:11px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;min-height:177px;display:flex;flex-direction:column;cursor:pointer;transition:.16s ease}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,34,26,.07)}.card.muted{opacity:.68;cursor:default}.topline{display:flex;justify-content:space-between;gap:10px}.type{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;color:var(--g)}.area{font-size:9px;color:var(--mut);text-align:right}.card h3{font-size:17px;line-height:1.15;margin:16px 0 7px}.card p{font-size:12px;line-height:1.45;color:var(--mut);margin:0 0 13px}.open{margin-top:auto;font-size:12px;color:var(--g);font-weight:900}.prep{margin-top:auto;font-size:10px;color:#6e776f;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
.community{background:var(--dark);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:13px}.plane{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px}.community p{margin:4px 0 0;color:#bdc9c0;font-size:12px}.community button{margin-left:auto;background:#fff;color:var(--dark);border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}
.footer{text-align:center;color:var(--mut);font-size:10px;padding:25px 0 7px}.nav{display:none;position:fixed;z-index:40;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,680px);background:rgba(20,34,26,.96);border-radius:20px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 12px 35px rgba(0,0,0,.22)}.nav button{border:0;background:transparent;color:#b9c6bd;border-radius:13px;padding:8px 4px;font-size:10px;font-weight:850;cursor:pointer}.nav button.on{background:rgba(255,255,255,.1);color:#fff}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(5,10,7,.58);display:none;align-items:flex-end;padding:10px}.drawer.on{display:flex}.sheet{background:#fff;width:min(100%,700px);max-height:88vh;overflow:auto;margin:auto;border-radius:26px 26px 18px 18px;padding:21px}.sheethead{display:flex;justify-content:space-between;gap:12px}.sheet h2{margin:5px 0 0;font-size:25px}.x{width:39px;height:39px;border:0;border-radius:12px;background:#eff2ef;font-size:22px;cursor:pointer}.block{padding:14px 0;border-bottom:1px solid var(--line)}.block label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--g);font-weight:950;margin-bottom:6px}.block p{margin:0;font-size:14px;line-height:1.5;color:#3f4942}.sheetactions{display:flex;gap:9px;margin-top:14px}.sheetactions a{text-decoration:none;flex:1;text-align:center}
.empty{background:#fff;border:1px dashed #cbd5cd;border-radius:17px;padding:22px;text-align:center;color:var(--mut)}
@media(max-width:760px){.nav{display:grid}.wrap{padding-bottom:92px}.grid{grid-template-columns:1fr}.step{grid-template-columns:38px 1fr}.step .badge{grid-column:2;width:max-content}.hero{padding:22px}.brand span{display:none}.community{align-items:flex-start}.community button{margin-left:0}.community{flex-wrap:wrap}}
</style>
</head>

<script>
(()=>{
const D=window.SUPPORTO_DATA,S={journey:"Primi 7 giorni",filter:"Tutti",q:""},app=document.getElementById("app"),drawer=document.getElementById("drawer"),$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const go=id=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"}); const ext=u=>u&&window.open(u,"_blank","noopener");
function render(){const library=D.resources.filter(r=>r.library!==false),available=library.filter(r=>r.status==="disponibile").length,areas=["Tutti",...new Set(library.map(r=>r.area))];
app.innerHTML=`
<section class="hero" id="home"><div class="eyebrow">BE ONE TEAM · SUPPORTO 3.0</div><h1>${esc(D.meta.subtitle)}</h1><p>Un unico punto per trovare formazione, strumenti e prossimi passi. Segui il percorso oppure cerca direttamente ciò che ti serve.</p><div class="actions"><button class="btn primary" id="start">Inizia dai primi 7 giorni</button><button class="btn secondary" id="library">Vai ai materiali</button></div><div class="stats"><span class="stat"><b>${available}</b> materiali disponibili</span><span class="stat"><b>7 · 30 · 90</b> percorso guidato</span><span class="stat">Aggiornato ${esc(D.meta.updated)}</span></div></section>
<section class="section" id="percorso"><div class="head"><div><div class="eyebrow">Percorso guidato</div><h2>Cosa fare adesso</h2></div><small>segui l'ordine</small></div><div class="tabs">${Object.keys(D.paths).map(x=>`<button class="tab ${S.journey===x?"on":""}" data-j="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="steps" id="steps"></div></section>
<section class="section" id="materiali"><div class="head"><div><div class="eyebrow">Libreria</div><h2>Materiali del team</h2></div><small>disponibili + in preparazione</small></div><input id="search" class="search" placeholder="Cerca un materiale…"><div class="chips">${areas.map(a=>`<button class="chip ${S.filter===a?"on":""}" data-a="${esc(a)}">${esc(a)}</button>`).join("")}</div><div class="grid" id="grid"></div></section>
<section class="section" id="team"><div class="head"><div><div class="eyebrow">Community</div><h2>Resta collegato al team</h2></div></div><div class="community"><div class="plane">✈</div><div><b>Telegram Team</b><p>Avvisi, aggiornamenti e collegamenti rapidi ai materiali.</p></div><button id="tgGo">Apri Telegram</button></div></section>
<div class="footer">BE ONE TEAM · SUPPORTO 3.0</div>`;
$("start").onclick=()=>go("percorso");$("library").onclick=()=>go("materiali");$("tgGo").onclick=()=>ext(D.telegram);$("search").oninput=e=>{S.q=e.target.value;cards()};
document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{S.journey=b.dataset.j;document.querySelectorAll("[data-j]").forEach(x=>x.classList.toggle("on",x.dataset.j===S.journey));steps()});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.a;document.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x.dataset.a===S.filter));cards()});steps();cards()}
function steps(){const rows=D.paths[S.journey]||[];$("steps").innerHTML=rows.map(r=>`<div class="step" data-resource="${esc(r.resource||"")}"><div class="num">${r.n}</div><div><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div><span class="badge ${r.status==="disponibile"?"ready":""}">${r.status==="disponibile"?"DISPONIBILE":"IN PREPARAZIONE"}</span></div>`).join("");document.querySelectorAll(".step[data-resource]").forEach(e=>{if(e.dataset.resource)e.onclick=()=>detail(D.resources.find(r=>r.id===e.dataset.resource))})}
function cards(){const q=S.q.trim().toLowerCase(),rows=D.resources.filter(r=>r.library!==false&&(S.filter==="Tutti"||r.area===S.filter)&&(!q||[r.title,r.area,r.type,r.description,r.learn].join(" ").toLowerCase().includes(q))).sort((a,b)=>a.order-b.order);$("grid").innerHTML=rows.length?rows.map(r=>`<article class="card ${r.status!=="disponibile"?"muted":""}" data-id="${esc(r.id)}"><div class="topline"><span class="type">${esc(r.type)}</span><span class="area">${esc(r.area)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p>${r.status==="disponibile"?`<div class="open">${esc(r.cta||"Apri materiale")} →</div>`:'<div class="prep">In preparazione</div>'}</article>`).join(""):'<div class="empty">Nessun materiale trovato.</div>';document.querySelectorAll(".card:not(.muted)").forEach(e=>e.onclick=()=>detail(D.resources.find(r=>r.id===e.dataset.id)))}
function detail(r){if(!r)return;$("dType").textContent=[r.type,r.area].filter(Boolean).join(" · ");$("dTitle").textContent=r.title;$("dLearn").textContent=r.learn||r.description;$("dAction").textContent=r.action||"Apri il materiale e applica il contenuto.";$("dNext").textContent=r.next||"Continua con il modulo successivo.";const a=$("dActions");a.querySelectorAll("a.extra").forEach(x=>x.remove());const o=$("dOpen");if(Array.isArray(r.links)&&r.links.length){o.style.display="none";r.links.forEach((x,i)=>{const el=document.createElement("a");el.className="btn "+(i===0?"primary":"secondary")+" extra";el.target="_blank";el.rel="noopener";el.href=x.url;el.textContent=x.label;a.insertBefore(el,$("close2"))})}else{o.textContent=r.cta||"Apri materiale";o.href=r.link||"#";o.style.display=r.link?"block":"none"}drawer.classList.add("on")}
function close(){drawer.classList.remove("on")}document.getElementById("tgTop").onclick=()=>ext(D.telegram);$("close").onclick=close;$("close2").onclick=close;drawer.onclick=e=>{if(e.target===drawer)close()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");go(b.dataset.go)});render();
})();
</script>
</body></html>
